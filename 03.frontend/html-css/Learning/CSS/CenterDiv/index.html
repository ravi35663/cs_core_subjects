<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .centered {
            position:absolute;
            top: 50%;
            left: 50%;
            transform: (-50%,-50%);
            background-color: orange;
        }
    </style>
</head>
<body>
    <!-- 
        position: absolute;: This removes the element from the normal document flow 
            so that it can be positioned relative to its containing block.
        top: 50%; and left: 50%;: This positions the element's top-left corner at the 
            center of its containing block.
        transform: translate(-50%, -50%);: This moves the element back by half of its 
            width and height, effectively centering it both horizontally and vertically.
    -->
    <div class="centered">
        Centred Div
    </div>
</body>
</html>
